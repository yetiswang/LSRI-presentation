<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Global SDL Landscape · Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<style>
:root{
  --bg:         oklch(0.18 0.01 240);
  --bg-2:       oklch(0.22 0.01 240);
  --bg-3:       oklch(0.26 0.01 240);
  --ink:        oklch(0.94 0.01 85);
  --ink-2:      oklch(0.78 0.01 85);
  --ink-3:      oklch(0.58 0.01 85);
  --ink-4:      oklch(0.42 0.01 240);
  --rule:       oklch(0.32 0.01 240);
  --rule-2:     oklch(0.28 0.01 240);
  --land:       oklch(0.24 0.01 240);
  --land-edge:  oklch(0.32 0.01 240);
  --graticule:  oklch(0.26 0.01 240);

  --c-national:   oklch(0.78 0.14 85);
  --c-academic:   oklch(0.78 0.14 200);
  --c-commercial: oklch(0.72 0.18 25);
  --c-labos:      oklch(0.78 0.14 300);

  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

*{ box-sizing:border-box; }
html, body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font-sans); }
body{ min-height:100vh; -webkit-font-smoothing:antialiased; }

#app{
  display:grid;
  grid-template-columns: 300px 1fr 320px;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "header header header"
    "left   map    right"
    "footer footer footer";
  gap:0;
  min-height:100vh;
}

/* Header */
header.top{
  grid-area:header;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:22px 28px 18px;
  border-bottom:1px solid var(--rule);
  gap:40px;
}
.brand .eyebrow{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  letter-spacing:0.22em; text-transform:uppercase; margin-bottom:6px;
}
.brand h1{
  font-family:var(--font-sans); font-weight:600; font-size:28px; letter-spacing:-0.01em;
  margin:0; color:var(--ink);
}
.brand h1 .dim{ color:var(--ink-3); font-weight:400; }

.counts{
  display:flex; gap:28px; font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  letter-spacing:0.1em;
}
.counts .n{ color:var(--ink); font-size:22px; font-weight:500; letter-spacing:0; display:block; font-variant-numeric:tabular-nums; }
.counts .lbl{ text-transform:uppercase; }

/* Sidebars */
aside{
  padding:24px 22px 24px;
  border-right:1px solid var(--rule);
  overflow-y:auto;
  max-height:calc(100vh - 150px);
}
aside.right{ border-right:0; border-left:1px solid var(--rule); grid-area:right; }
aside.left{ grid-area:left; }

.section-h{
  font-family:var(--font-mono); font-size:10px; color:var(--ink-3);
  letter-spacing:0.22em; text-transform:uppercase;
  margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--rule-2);
}
.section-h:first-child{ margin-top:0; }

/* Filter chips */
.chips{ display:flex; flex-direction:column; gap:4px; }
.chip{
  display:flex; align-items:center; gap:10px;
  padding:7px 10px; border-radius:3px;
  background:transparent; border:1px solid transparent;
  cursor:pointer; font-family:var(--font-sans); font-size:13px; color:var(--ink-2);
  text-align:left; width:100%;
  transition: background .12s, color .12s, border-color .12s;
}
.chip:hover{ background:var(--bg-2); color:var(--ink); }
.chip.active{
  background:var(--bg-2); border-color:var(--rule); color:var(--ink);
}
.chip .dot{
  width:8px; height:8px; border-radius:50%; background:var(--ink-4); flex:0 0 auto;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.3) inset;
}
.chip.active .dot{ box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px currentColor; }
.chip .n{
  margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.chip.dim{ opacity:0.5; }

.chip[data-tier="national"]   .dot{ background:var(--c-national); }
.chip[data-tier="academic"]   .dot{ background:var(--c-academic); }
.chip[data-tier="commercial"] .dot{ background:var(--c-commercial); }
.chip[data-tier="labos"]      .dot{ background:var(--c-labos); }

.legend-row{
  display:flex; align-items:center; gap:10px; padding:5px 0;
  font-size:12px; color:var(--ink-2);
}
.legend-row .sw{ width:12px; height:12px; border-radius:50%; }

/* Reset button */
.reset-btn{
  width:100%; margin-top:8px;
  padding:8px 10px; background:transparent;
  border:1px solid var(--rule); color:var(--ink-2);
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  cursor:pointer; border-radius:2px;
}
.reset-btn:hover{ background:var(--bg-2); color:var(--ink); }

/* Map */
.map-wrap{
  grid-area:map;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(ellipse 80% 70% at 50% 45%, oklch(0.22 0.01 240) 0%, var(--bg) 80%);
}
#map{ width:100%; height:100%; display:block; touch-action:none; user-select:none; }
.map-wrap svg{ width:100%; height:100%; display:block; }

.graticule{ fill:none; stroke:var(--graticule); stroke-width:0.5; opacity:0.5; vector-effect:non-scaling-stroke; }
.sphere{ fill:none; stroke:var(--rule); stroke-width:1; vector-effect:non-scaling-stroke; }
.sphere-fill{ pointer-events:none; }
.atmosphere{ pointer-events:none; }
.specular{ pointer-events:none; }
.land{ fill:var(--land); stroke:none; vector-effect:non-scaling-stroke; transition: opacity .3s; }
.filtering .land{ opacity:0.5; }
.filtering .graticule{ opacity:0.2; }
.borders{ fill:none; stroke:oklch(0.32 0.01 240); stroke-width:0.5; opacity:0.9; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
.borders-outer{ fill:none; stroke:oklch(0.40 0.01 240); stroke-width:0.7; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
.provinces{
  fill:none; stroke:oklch(0.30 0.01 240); stroke-width:0.4;
  vector-effect:non-scaling-stroke; stroke-linejoin:round;
  stroke-dasharray: 2 2;
  opacity:0; transition: opacity .35s;
  pointer-events:none;
}
.country-label{
  font-family:var(--font-mono); font-weight:500;
  font-size:8px; fill:var(--ink-3); opacity:0;
  letter-spacing:0.18em; pointer-events:none;
  transition: opacity .35s;
  paint-order: stroke fill;
  stroke: var(--bg); stroke-width: 2.5px; stroke-linejoin:round;
}
.country-label[data-tier="1"]{ font-size:8.5px; fill:var(--ink-2); letter-spacing:0.2em; }
.country-label[data-tier="2"]{ font-size:7.5px; fill:var(--ink-3); }
.country-label[data-tier="3"]{ font-size:7px; fill:var(--ink-3); opacity:0.7; }

.province-label{
  font-family:var(--font-mono); font-weight:400;
  font-size:8px; fill:var(--ink-3); opacity:0;
  letter-spacing:0.06em; pointer-events:none;
  transition: opacity .35s;
  paint-order: stroke fill;
  stroke: var(--bg); stroke-width: 2.5px; stroke-linejoin:round;
}

/* Markers */
.marker{ cursor:pointer; transition: opacity .2s; }
.marker .ring{ fill:none; stroke:currentColor; stroke-width:1; opacity:0.4; }
.marker .core{ fill:currentColor; }
.marker.dim{ opacity:0.08; pointer-events:none; }
.marker.dim .ring{ opacity:0; }
.marker.dim .core{ r:2; }

.marker.hl{
  filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor);
}
.marker.hl .core{ filter: brightness(1.4); }
.marker.hl .ring{ opacity:0.8; stroke-width:1.5; }
.marker.hl .pulse{
  fill:none; stroke:currentColor; stroke-width:1.5;
  animation: pulse 1.8s ease-out infinite;
  transform-origin: center;
}
@keyframes pulse{
  0%   { r: 6;  opacity:0.8; stroke-width:2; }
  100% { r: 28; opacity:0;   stroke-width:0.5; }
}

.marker-label{
  font-family:var(--font-mono); font-size:9.5px; fill:var(--ink-2);
  pointer-events:none; letter-spacing:0.02em;
  text-shadow: 0 0 4px var(--bg), 0 0 4px var(--bg);
}

/* Tooltip */
.tip{
  position:absolute; pointer-events:none;
  background:oklch(0.14 0.01 240 / 0.96);
  border:1px solid var(--rule);
  border-radius:3px;
  padding:12px 14px;
  min-width:260px; max-width:320px;
  color:var(--ink);
  backdrop-filter:blur(6px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  opacity:0; transition: opacity .14s;
  z-index:20;
  font-size:12px;
}
.tip.show{ opacity:1; }
.tip .t-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.tip .t-dot{ width:10px; height:10px; border-radius:50%; }
.tip .t-name{ font-weight:600; font-size:14px; line-height:1.2; }
.tip .t-meta{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
.tip .t-row{ display:flex; justify-content:space-between; gap:14px; padding:3px 0; color:var(--ink-2); }
.tip .t-row .k{ color:var(--ink-3); font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; }
.tip .t-row .v{ text-align:right; }

/* Right rail: active highlight list */
.list{ display:flex; flex-direction:column; gap:0; }
.list-item{
  padding:10px 4px; border-bottom:1px solid var(--rule-2);
  display:grid; grid-template-columns: 14px 1fr auto; gap:10px; align-items:start;
  cursor:pointer;
}
.list-item:hover{ background:var(--bg-2); }
.list-item .ldot{ width:8px; height:8px; border-radius:50%; margin-top:6px; }
.list-item .lname{ font-size:13px; color:var(--ink); font-weight:500; line-height:1.25; }
.list-item .lmeta{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); letter-spacing:0.04em; margin-top:2px; }
.list-item .lcountry{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-2); letter-spacing:0.04em; }

/* Footer */
footer.bot{
  grid-area:footer;
  padding:12px 28px;
  border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3);
  letter-spacing:0.12em; text-transform:uppercase;
}
footer .leg{ display:flex; gap:20px; align-items:center; }
footer .leg .item{ display:flex; gap:6px; align-items:center; }
footer .leg .circ{ border:1px solid var(--ink-3); border-radius:50%; }

.empty{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  padding:16px 4px; text-align:center; border:1px dashed var(--rule-2); border-radius:3px;
}

/* Zoom controls */
.zoom-ctl{
  position:absolute; top:16px; right:16px; z-index:10;
  display:flex; flex-direction:column; gap:4px;
  background:oklch(0.14 0.01 240 / 0.9);
  border:1px solid var(--rule); border-radius:4px;
  padding:4px;
  backdrop-filter:blur(4px);
}
.zoom-ctl button{
  width:32px; height:32px; padding:0;
  background:transparent; border:0;
  color:var(--ink-2); cursor:pointer;
  font-family:var(--font-mono); font-size:18px; line-height:1;
  border-radius:2px;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, color .12s;
}
.zoom-ctl button:hover{ background:var(--bg-3); color:var(--ink); }
.zoom-ctl button:active{ background:var(--bg-2); }
.zoom-ctl button + button{ border-top:1px solid var(--rule-2); }
.zoom-ctl #z-reset{ font-size:15px; }

/* Region navigation buttons — overlaid on the map, below zoom controls */
.region-nav{
  position:absolute; top:140px; right:16px; z-index:20;
  display:flex; flex-direction:column; gap:4px;
}
.region-nav button{
  padding:6px 10px;
  background:oklch(0.14 0.01 240 / 0.9);
  border:1px solid var(--rule);
  color:var(--ink-2); cursor:pointer;
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  letter-spacing:0.08em; text-transform:uppercase;
  border-radius:3px;
  backdrop-filter:blur(4px);
  transition:background .15s, color .15s, border-color .15s;
}
.region-nav button:hover{ background:var(--bg-3); color:var(--ink); border-color:var(--ink-3); }
.region-nav button.active-region{ border-color:var(--accent); color:var(--accent); }

/* Filter callout — contextual annotation on the map */
.filter-callout{
  position:absolute; left:50%; transform:translateX(-50%);
  font-family:var(--font-mono); font-size:11px; color:var(--ink-2);
  letter-spacing:0.04em; line-height:1.5;
  padding:8px 16px; border:1px solid var(--accent); border-radius:3px;
  background:oklch(0.14 0.01 240 / 0.88); backdrop-filter:blur(6px);
  max-width:520px; text-align:center;
  pointer-events:none; z-index:25;
  opacity:0; transition:opacity .4s;
}
.filter-callout.visible{ opacity:1; }
.filter-callout strong{ color:var(--accent); }

.zoom-hint{
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3);
  letter-spacing:0.14em; text-transform:uppercase;
  padding:6px 14px; border:1px solid var(--rule-2); border-radius:2px;
  background:oklch(0.14 0.01 240 / 0.7); backdrop-filter:blur(4px);
  pointer-events:none; transition:opacity .5s;
}
.zoom-hint.fade{ opacity:0; }

/* ============================================================
   MOBILE RESPONSIVE — added 2026-05-28
   Strategy: collapse 3-col grid to single col, hide sidebars
   behind toggle buttons, bump fonts + tap targets for touch.
   ============================================================ */

/* Tablet + phone: ≤900px */
@media (max-width: 900px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header"
      "map"
      "footer";
    min-height: 100dvh;
  }
  /* Header: vertical stack, smaller */
  header.top {
    flex-direction: column;
    align-items: flex-start;
    padding: 14px 16px 12px;
    gap: 10px;
  }
  .brand h1 { font-size: 24px; line-height: 1.2; font-weight: 600; }
  .brand .eyebrow { font-size: 10px; }
  .counts {
    width: 100%;
    gap: 14px;
    flex-wrap: wrap;
  }
  .counts .n { font-size: 22px; font-weight: 600; }
  .counts .lbl { font-size: 11px; letter-spacing: 0.16em; }
  /* Sidebars become full-width overlay sheets */
  aside.left, aside.right {
    position: fixed;
    top: 0;
    height: 100dvh;
    width: 88vw;
    max-width: 400px;
    z-index: 100;
    background: var(--bg);
    border: 0;
    box-shadow: 0 0 60px rgba(0,0,0,0.7);
    transition: transform .25s ease;
    padding: 22px 22px 32px;
    max-height: 100dvh;
    overflow-y: auto;
    font-size: 16px;  /* base body text inside drawer — was browser default */
  }
  aside.left {
    left: 0;
    transform: translateX(-100%);
    border-right: 1px solid var(--rule);
  }
  aside.right {
    right: 0;
    transform: translateX(100%);
    border-left: 1px solid var(--rule);
  }
  aside.left.open { transform: translateX(0); }
  aside.right.open { transform: translateX(0); }
  /* Backdrop when a drawer is open */
  .drawer-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 99;
    backdrop-filter: blur(2px);
  }
  body.drawer-open .drawer-backdrop { display: block; }
  /* Drawer close X */
  .drawer-close {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px;
    background: var(--bg-2);
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: 4px;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  /* Mobile-only floating toggle buttons */
  .mob-toggle {
    position: fixed;
    bottom: 70px;
    z-index: 50;
    background: oklch(0.16 0.01 240 / 0.96);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 12px 18px;
    border-radius: 24px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    min-height: 44px;
    display: flex; align-items: center; gap: 8px;
  }
  .mob-toggle.left  { left: 16px; }
  .mob-toggle.right { right: 16px; }
  .mob-toggle .badge {
    background: var(--accent);
    color: var(--bg);
    border-radius: 10px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 2px;
  }
  /* Bigger touch targets + readable type in sidebars */
  .section-h { font-size: 14px; font-weight: 600; margin: 22px 0 12px; letter-spacing: 0.18em; color: var(--ink-2); }
  .chip {
    padding: 14px 14px;
    font-size: 16px;
    min-height: 52px;
    gap: 14px;
    border-radius: 6px;
  }
  .chip .dot { width: 12px; height: 12px; }
  .chip .n { font-size: 14px; font-weight: 500; }
  .legend-row { font-size: 15px; padding: 10px 0; gap: 14px; }
  .reset-btn {
    padding: 14px 14px;
    font-size: 14px;
    min-height: 50px;
    letter-spacing: 0.14em;
  }
  .list-item { padding: 16px 6px; min-height: 64px; gap: 14px; }
  .list-item .lname { font-size: 16px; line-height: 1.3; font-weight: 600; }
  .list-item .lmeta, .list-item .lcountry { font-size: 13px; margin-top: 3px; }
  /* Map takes full viewport between header and footer */
  .map-wrap { min-height: calc(100dvh - 140px); }
  /* Zoom controls + region nav: slightly larger touch targets */
  .zoom-ctl {
    top: 12px; right: 12px; padding: 6px;
  }
  .zoom-ctl button {
    width: 40px; height: 40px;
    font-size: 22px;
  }
  .zoom-ctl #z-reset { font-size: 18px; }
  .region-nav { top: 168px; right: 12px; }
  .region-nav button {
    padding: 9px 12px;
    font-size: 12px;
    min-height: 36px;
  }
  /* Tooltip: anchored at bottom on mobile, wider */
  .tip {
    left: 8px !important;
    right: 8px !important;
    bottom: 76px !important;
    top: auto !important;
    transform: none !important;
    min-width: 0;
    max-width: none;
    width: auto;
    font-size: 13px;
    padding: 14px 16px;
  }
  .tip .t-name { font-size: 15px; }
  .tip .t-meta { font-size: 11px; }
  .tip .t-row { padding: 4px 0; font-size: 13px; }
  .tip .t-row .k { font-size: 11px; }
  /* Filter callout: smaller + lower */
  .filter-callout {
    font-size: 11px;
    padding: 6px 12px;
    max-width: 86vw;
    top: 6px !important;
  }
  /* Map zoom hint */
  .zoom-hint {
    display: none;
  }
  /* Footer: shrink */
  footer.bot {
    padding: 10px 14px;
    font-size: 9.5px;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
    text-align: left;
  }
  footer .leg { flex-wrap: wrap; gap: 12px; }
  /* Marker labels: hide on mobile to reduce clutter */
  .marker-label { display: none; }

  /* SVG country labels: bigger on mobile (default 7-8.5px is unreadable) */
  .country-label[data-tier="1"]{ font-size: 14px !important; letter-spacing: 0.12em; }
  .country-label[data-tier="2"]{ font-size: 12px !important; }
  .country-label[data-tier="3"]{ font-size: 11px !important; }
  /* Region nav: bigger touch targets */
  .region-nav { top: 220px; }
  .region-nav button {
    padding: 12px 14px;
    font-size: 13px;
    min-height: 44px;
  }
  /* Zoom controls: even bigger touch targets */
  .zoom-ctl button { width: 48px; height: 48px; font-size: 26px; }
  .zoom-ctl #z-reset { font-size: 22px; }
  /* Header counts: scroll horizontally if too many, larger font */
  .counts { overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .counts > div { flex-shrink: 0; }
}

/* Phone narrow: ≤480px */
@media (max-width: 480px) {
  .brand h1 { font-size: 22px; }
  .brand h1 .dim { display: none; }
  .counts { gap: 10px; }
  .counts .n { font-size: 20px; }
  header.top { padding: 12px 14px 10px; gap: 8px; }
  /* Drawer fills more of the screen */
  aside.left, aside.right { width: 92vw; max-width: none; }
  .mob-toggle {
    bottom: 60px;
    padding: 10px 14px;
    font-size: 13px;
  }

    min-height: 44px;

    width: 44px;
    height: 44px;
    font-size: 22px !important;
    color: var(--ink) !important;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);

    align-items: center;
    justify-content: center;

  .mob-toggle {

    z-index: 100 !important;
    cursor: pointer;
  }
  .mob-toggle:active { background: rgba(255,255,255,0.06) !important; }

  .mob-toggle.right { right: 6px !important; }
  .mob-toggle .badge {
    position: absolute;
    top: 4px;
    right: 2px;
    background: var(--accent);

    font-size: 9px;
    font-weight: 700;
    min-width: 14px;
    text-align: center;
    line-height: 1.3;
  }
  /* Title bar: a single clean strip at the top of the page */
  header.top {
    position: relative;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    padding: 14px 56px;        /* leave space for left/right icons */
    gap: 0;
    border-bottom: 1px solid var(--rule);
    min-height: 56px;
    background: var(--bg);
    z-index: 25;

  .brand h1 {

    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--ink);

  .brand h1 .dim { display: none; }
  /* Hide desktop counts row — surface inside the filter drawer instead */
  .counts { display: none; }
  /* The globe gets the whole viewport */
  .map-wrap {
    min-height: calc(100dvh - 56px);
  }
  /* Zoom controls + region nav move to bottom-right (thumb zone) */
  .zoom-ctl {
    top: auto !important;

  .region-nav {

  header.top::after {

/* v8: ensure pin taps always fire on touch */
.marker, .marker .hit {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.marker { pointer-events: all !important; }
.marker.dim .hit { pointer-events: none; }

/* v9: hide expensive layers during interaction for smoother drag/pinch */
/* v18: only hide the genuinely heavy graticule + provinces during interaction
   so the user doesn't see country-name pop-in/pop-out lag.
   Labels stay visible during drag; their positions update every frame. */
/* v20: instant hide for graticule/provinces — no transition causes faster first frame */
body.interacting .graticule,
body.interacting .provinces { opacity: 0; }
body.interacting .marker-label { visibility: hidden; }
body.interacting .land { opacity: 0.92; }
/* Pre-warm GPU layers so the first touch doesn't pay layer-promotion cost */
.land, .borders, .graticule, .provinces, #markers, #map {
  will-change: opacity, transform;
  transform: translateZ(0);
}
/* Container hint to keep the whole SVG on its own compositing layer */
.map-wrap { transform: translateZ(0); will-change: transform; }
/* GPU compositing hint */
.map-wrap, #map { will-change: transform; }

/* ============================================================
   MOBILE v11 — Maps-app bottom sheet for pin details
   Tap pin → sheet slides up. Swipe-down or tap backdrop → close.
   Sheet replaces the floating tooltip on mobile.
   ============================================================ */
.sheet {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  background: oklch(0.12 0.01 240);
  border-top: 1px solid var(--rule);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.4, 0.0, 0.2, 1);
  z-index: 105;  /* above drawer-backdrop (99) so sheet is visible */
  max-height: 72vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom, 0);
  display: none;   /* desktop hides */
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 40px; height: 4px;
  background: var(--ink-3);
  border-radius: 2px;
  margin: 10px auto 6px;
  opacity: 0.6;
}
.sheet-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 32px; height: 32px;
  background: var(--bg-2);
  border: 1px solid var(--rule);
  color: var(--ink);
  border-radius: 16px;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
}
.sheet-body { padding: 6px 22px 32px; }
.sheet-head { display: flex; align-items: center; gap: 12px; margin: 8px 0 6px; }
.sheet-head .s-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.sheet-head .s-name { font-size: 22px; font-weight: 600; line-height: 1.2; color: var(--ink); flex: 1; min-width: 0; }
.sheet-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; margin: 6px 0 14px; }
.sheet-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule-2); }
.sheet-row .k { color: var(--ink-3); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0; }
.sheet-row .v { color: var(--ink); text-align: right; font-size: 14px; }

/* Bottom-sheet shows only on mobile; tooltip suppressed on mobile */
@media (min-width: 901px) {
  .sheet { display: none !important; }
}
@media (max-width: 900px) {
  .sheet { display: block; }
  .tip { display: none !important; }
  /* Bottom-sheet backdrop reuses the drawer backdrop pattern */
  body.sheet-open .drawer-backdrop { display: block !important; z-index: 100; }
  /* When sheet is open, push zoom controls up so they're not hidden */
  body.sheet-open .zoom-ctl,
  body.sheet-open .region-nav {
    transform: translateY(-72vh);
    transition: transform 0.32s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  /* Selected pin highlight: brighter ring + pulse */
  .marker.selected .ring {
    opacity: 1;
    stroke-width: 2;
    stroke: var(--accent);
  }
  .marker.selected .core {
    filter: brightness(1.6);
  }
}

/* v22 CANVAS: render heavy geometry on a 2D canvas behind the SVG */
.map-wrap { position: relative; }
#map-canvas {
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  display: block;
}
#map { position: relative; z-index: 1; background: transparent; }
/* Hide the SVG nodes we no longer paint — canvas renders them now */
.atmosphere, .sphere-fill, .specular, .graticule, .land, .borders, .borders-outer, .provinces {
  display: none !important;
}


/* v23: lock body gestures so the globe's drag/pinch don't bleed into page-level
   scroll/zoom on iOS Safari. Inner scrollable areas (drawers, sheet) opt back in. */
html, body {
  touch-action: none !important;
  overflow: hidden !important;
  overscroll-behavior: none !important;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
#app {
  touch-action: none;
  height: 100dvh;
  overflow: hidden;
}
.map-wrap, #map-canvas, #map {
  touch-action: none !important;
}
aside.left, aside.right, .sheet, .sheet-body {
  touch-action: pan-y;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

  .marker-label:not(.sdl-label) { display: none; }
  .sdl-label { font-size: 13px; font-weight: 600; }
}
body.interacting .sdl-label { visibility: hidden; }

function redraw(){
    // v22: canvas-driven redraw — geometry goes to <canvas> instead of SVG path 'd' updates

    // Clear with the page background colour
    _ctx.save();

      _ctx.beginPath();
      _ctx.arc(CX, CY, r + 30, 0, Math.PI * 2);
      _ctx.fill();
    }
    // Sphere fill (gradient sphere body)
    {
      const grad = _ctx.createRadialGradient(CX - r * 0.25, CY - r * 0.35, r * 0.1, CX, CY, r);
      grad.addColorStop(0, 'oklch(0.30 0.02 240)');
      grad.addColorStop(1, 'oklch(0.16 0.01 240)');
      _ctx.fillStyle = grad;
      _ctx.beginPath();
      _ctx.arc(CX, CY, r, 0, Math.PI * 2);
      _ctx.fill();

    // Graticule (lat/lon grid)
    _ctx.strokeStyle = COL_GRATICULE;
    _ctx.lineWidth = 0.5;
    _ctx.globalAlpha = 0.5;
    _ctx.beginPath();
    if (isInteracting) {
      if (!window._coarseGrat) window._coarseGrat = d3.geoGraticule().step([30, 30]);
      _pathC(window._coarseGrat());
    } else {
      _pathC(gratGen());
    }
    _ctx.stroke();
    _ctx.globalAlpha = 1;

    // Land fill
    _ctx.fillStyle = COL_LAND;
    _ctx.beginPath();
    _pathC(landFeat);
    _ctx.fill();

    // Country borders (inner mesh)
    _ctx.strokeStyle = 'oklch(0.32 0.01 240)';
    _ctx.lineWidth = 0.5;
    _ctx.globalAlpha = 0.9;
    _ctx.beginPath();
    _pathC(countriesMesh);
    _ctx.stroke();

    // Outer borders (slightly thicker)
    _ctx.strokeStyle = 'oklch(0.40 0.01 240)';
    _ctx.lineWidth = 0.7;
    _ctx.beginPath();
    _pathC(countriesOuter);
    _ctx.stroke();
    _ctx.globalAlpha = 1;

    if (china && k >= 2.2) {

      _ctx.setLineDash([2, 2]);
      _ctx.beginPath();
      _pathC({type:'FeatureCollection', features: china.features});
      _ctx.stroke();
      _ctx.setLineDash([]);
    }

    // Specular highlight (subtle bright spot near sphere top-left)
    {
      const grad = _ctx.createRadialGradient(CX - r * 0.45, CY - r * 0.50, 0, CX - r * 0.45, CY - r * 0.50, r * 0.7);
      grad.addColorStop(0, 'oklch(0.90 0.01 85 / 0.10)');
      grad.addColorStop(1, 'oklch(0.90 0.01 85 / 0.00)');
      _ctx.fillStyle = grad;
      _ctx.globalCompositeOperation = 'source-atop';
      _ctx.beginPath();
      _ctx.arc(CX, CY, r, 0, Math.PI * 2);
      _ctx.fill();
      _ctx.globalCompositeOperation = 'source-over';

    // Sphere outline (thin stroke at limb)
    _ctx.strokeStyle = COL_RULE;
    _ctx.lineWidth = 1;
    _ctx.beginPath();
    _ctx.arc(CX, CY, r, 0, Math.PI * 2);
    _ctx.stroke();

    const center = [-view.rotate[0], -view.rotate[1]];

    // v24 marker pass — projection, zoom-scaled radius, anti-overlap, label visibility
    // Step 1: project all markers, mark visibility, compute base offsets
    const _visible = [];
    DATA.forEach(d => {
      const p = projection([d.lon, d.lat]);
      const dist = gcDist(center, [d.lon, d.lat]);
      if (dist < 88 && p) {
        // Start each frame with the original radial offset (initialised at marker create)
        d._renderOff = [d._off[0], d._off[1]];

        d._dist = dist;
        _visible.push(d);
      } else {
        d._el.style.display = 'none';
        if (d._label) d._label.style.display = 'none';
      }
    });
    // Step 2: anti-overlap pass — push apart clustered markers
    // (Runs at any zoom; the separation distance scales with marker size.)
    const baseR = 8;   // SVG units — typical marker visual radius
    const zoomGrowth = Math.min(2.5, Math.sqrt(k));  // visual size factor: 1x at k=1, ~2.5x at k=6+
    const separation = baseR * 2.4 * zoomGrowth;
    for (let pass = 0; pass < 4; pass++) {
      for (let i = 0; i < _visible.length; i++) {
        const a = _visible[i];
        const ax = a._proj[0] + a._renderOff[0];
        const ay = a._proj[1] + a._renderOff[1];
        for (let j = i + 1; j < _visible.length; j++) {
          const b = _visible[j];
          const bx = b._proj[0] + b._renderOff[0];
          const by = b._proj[1] + b._renderOff[1];
          const dx = ax - bx;
          const dy = ay - by;
          const d2 = dx*dx + dy*dy;
          const min2 = separation * separation;
          if (d2 < min2 && d2 > 0.01) {
            const dist = Math.sqrt(d2);
            const push = (separation - dist) * 0.5;
            const ux = dx / dist;
            const uy = dy / dist;
            a._renderOff[0] += ux * push;
            a._renderOff[1] += uy * push;
            b._renderOff[0] -= ux * push;
            b._renderOff[1] -= uy * push;
          }
        }
      }
    }
    // Step 3: render each visible marker with scaled size + position + label
    const showLabels = k >= 3.0 && !document.body.classList.contains('interacting');
    _visible.forEach(d => {
      const x = d._proj[0] + d._renderOff[0];
      const y = d._proj[1] + d._renderOff[1];
      d._el.style.display = '';
      d._el.setAttribute('transform','translate('+x+','+y+') scale('+zoomGrowth+')');
      const limbFade = Math.min(1, Math.max(0, (88 - d._dist)/20));
      const isDim = d._el.classList.contains('dim');
      d._el.style.opacity = isDim ? limbFade * 0.08 : limbFade;
      d._x = x; d._y = y;
      d._el.querySelector('.m-inner').removeAttribute('transform');
      if (d._label) {
        if (showLabels && !isDim) {
          d._label.style.display = '';
          d._label.setAttribute('x', x);
          d._label.setAttribute('y', y + 12 * zoomGrowth + 8);  // below marker
          d._label.style.opacity = limbFade;
        } else {
          d._label.style.display = 'none';
        }
      }
    });

    // v18: labels stay visible during interaction (the disappear IS the lag).
    // Their per-frame update is cheap on modern hardware; keep them flowing
    // with the globe rotation instead of popping in/out.
    {
      // Cache the selector once: countryLabels + provinceLabels arrays already
      // hold the elements. We only need to hide elements that weren't matched.
      countryLabels.forEach(l => {
        const dist = gcDist(center, l.coord);
        if(dist >= 78){ l._el.style.display = 'none'; return; }
        const tier = l._el.dataset.tier;
        const show = (tier === '1' && k >= 1.0) ||
                     (tier === '2' && k >= 1.8) ||
                     (tier === '3' && k >= 3.0);
        if(!show) { l._el.style.display = 'none'; return; }
        const p = projection(l.coord);
        if(!p) { l._el.style.display = 'none'; return; }
        l._el.style.display = '';
        l._el.setAttribute('x', p[0]);
        l._el.setAttribute('y', p[1]);
        l._el.style.opacity = '1';
      });
      if(k >= 3.5){
        provinceLabels.forEach(l => {
          const dist = gcDist(center, l.coord);
          if(dist >= 60) { l._el.style.display = 'none'; return; }
          const p = projection(l.coord);
          if(!p) { l._el.style.display = 'none'; return; }
          l._el.style.display = '';
          l._el.setAttribute('x', p[0]);
          l._el.setAttribute('y', p[1]);
          l._el.style.opacity = '1';
        });
      } else {
        provinceLabels.forEach(l => { l._el.style.display = 'none'; });
      }
    }
    // else: labels are invisible via CSS; skip the work entirely. When
    // interaction ends, the next redraw will catch up.
  }

  function clampScale(s){ return Math.max(view.min, Math.min(view.max, s)); }

  function zoomBy(factor){
    view.scale = clampScale(view.scale * factor);
    redraw();
  }

  // === Inertia (mobile v10) ===
  // Tracks the last few pointer-move deltas with timestamps; on release,
  // if velocity is meaningful, the globe keeps rotating with friction decay
  // for a natural iOS flick feel. Re-touching cancels inertia.
  let velSamples = [];       // [{t, dx, dy}]
  let inertiaRafId = null;
  let inertiaVel = null;     // {vx, vy}  deg per frame
  const INERTIA_FRICTION = 0.94;
  const INERTIA_MIN = 0.02;          // stop when speed drops below this
  const INERTIA_SAMPLE_WINDOW_MS = 80;

  function recordSample(dx, dy){
    const t = performance.now();
    velSamples.push({t, dx, dy});
    // Keep only the most recent 80ms of samples
    while (velSamples.length && t - velSamples[0].t > INERTIA_SAMPLE_WINDOW_MS) {
      velSamples.shift();
    }
  }
  function computeReleaseVelocity(){
    if (velSamples.length < 2) return null;
    const first = velSamples[0];
    const last = velSamples[velSamples.length - 1];
    const dt = last.t - first.t;
    if (dt <= 0) return null;
    // Sum deltas and convert px/ms → deg/frame at ~60fps (16.67ms)
    let sumDx = 0, sumDy = 0;
    for (const s of velSamples) { sumDx += s.dx; sumDy += s.dy; }
    const k = view.scale / BASE_SCALE;
    const sens = 0.25 / k;
    // sumDx/sumDy are already in projection coords (1000×560); convert to deg/frame
    const vx = (sumDx / dt) * 16.67 * sens;
    const vy = (sumDy / dt) * 16.67 * sens;
    return {vx, vy};
  }
  function cancelInertia(){
    if (inertiaRafId !== null) cancelAnimationFrame(inertiaRafId);
    inertiaRafId = null;
    inertiaVel = null;
  }
  function startInertia(vx, vy){
    cancelInertia();
    const speed = Math.hypot(vx, vy);
    if (speed < INERTIA_MIN * 4) return;   // not fast enough to bother
    inertiaVel = {vx, vy};
    document.body.classList.add('interacting');
    const step = () => {
      if (!inertiaVel) return;
      view.rotate[0] += inertiaVel.vx;
      view.rotate[1] = Math.max(-89, Math.min(89, view.rotate[1] - inertiaVel.vy));
      inertiaVel.vx *= INERTIA_FRICTION;
      inertiaVel.vy *= INERTIA_FRICTION;
      redraw();
      const sp = Math.hypot(inertiaVel.vx, inertiaVel.vy);
      if (sp < INERTIA_MIN) {
        cancelInertia();
        document.body.classList.remove('interacting');
        return;
      }
      inertiaRafId = requestAnimationFrame(step);
    };
    inertiaRafId = requestAnimationFrame(step);
  }

  // Drag to rotate + pinch to zoom (multi-pointer)
  let dragging = null;
  const pointers = new Map();   // pointerId -> {x, y}
  let pinchStart = null;        // {dist, viewScale} when 2 fingers active

  function pinchDist(){
    if (pointers.size < 2) return 0;
    const arr = [...pointers.values()];
    const [a, b] = [arr[0], arr[1]];
    return Math.hypot(b.x - a.x, b.y - a.y);
  }
  svg.addEventListener('pointerdown', (e) => {
    if(e.target.closest('.marker')) return;
    cancelInertia();                 // any tap on map cancels in-flight inertia
    velSamples = [];                 // reset velocity window for new gesture
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      // Two-finger pinch starts
      pinchStart = { dist: pinchDist(), viewScale: view.scale };
      dragging = null;
      svg.style.cursor = 'grab';
      document.body.classList.add('interacting');
      return;
    }
    if (pointers.size === 1) {
      dragging = { x: e.clientX, y: e.clientY, r: [...view.rotate] };
      try { svg.setPointerCapture(e.pointerId); } catch(_) {}
      svg.style.cursor = 'grabbing';
      zHint.classList.add('fade');
      document.body.classList.add('interacting');
    }
  });
  svg.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }
    if (pointers.size >= 2 && pinchStart) {
      // Pinch zoom
      const d = pinchDist();
      if (d > 0 && pinchStart.dist > 0) {
        view.scale = clampScale(pinchStart.viewScale * (d / pinchStart.dist));
        redrawRaf();
      }
      return;
    }
    if(!dragging) return;
    const rect = svg.getBoundingClientRect();
    const dx = (e.clientX - dragging.x) * (1000 / rect.width);
    const dy = (e.clientY - dragging.y) * (560 / rect.height);
    // Record incremental delta since last frame for velocity tracking
    const prevX = (dragging._lastX != null) ? dragging._lastX : dragging.x;
    const prevY = (dragging._lastY != null) ? dragging._lastY : dragging.y;
    const incDx = (e.clientX - prevX) * (1000 / rect.width);
    const incDy = (e.clientY - prevY) * (560 / rect.height);
    dragging._lastX = e.clientX;
    dragging._lastY = e.clientY;
    recordSample(incDx, incDy);
    const k = view.scale / BASE_SCALE;
    const sens = 0.25 / k;
    view.rotate[0] = dragging.r[0] + dx * sens;
    view.rotate[1] = Math.max(-89, Math.min(89, dragging.r[1] - dy * sens));
    redrawRaf();
  });
  // v21: smooth-precision-ramp coast on gesture end
  let _precisionRampId = null;
  function precisionRamp(){
    if (_precisionRampId) cancelAnimationFrame(_precisionRampId);
    const steps = [4, 2, 1, 0.7];  // 4 frames to walk precision back from coarse → sharp
    let i = 0;
    function tick(){
      projection.precision(steps[i]);
      redraw();
      i++;
      if (i < steps.length) {
        _precisionRampId = requestAnimationFrame(tick);
      } else {
        _precisionRampId = null;
      }
    }
    _precisionRampId = requestAnimationFrame(tick);
  }

  function endDrag(e){
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) {
      const wasDragging = !!dragging;
      const releaseVel = wasDragging ? computeReleaseVelocity() : null;
      dragging = null;
      if (!releaseVel || Math.hypot(releaseVel.vx, releaseVel.vy) < INERTIA_MIN * 4) {
        // v22: canvas is fast enough; simple immediate class removal works
        document.body.classList.remove('interacting');
      } else {
        startInertia(releaseVel.vx, releaseVel.vy);
      }
    }
    svg.style.cursor = 'grab';
    try{ svg.releasePointerCapture(e.pointerId); }catch(_){}
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('pointerleave', endDrag);

  // Tap/click on empty map (not on a marker) closes the tip
  svg.addEventListener('click', (e) => {
    if (!e.target.closest('.marker')) {
      hideTip();
    }
  });

  // Belt + suspenders: on touchstart on empty map, also dismiss (handles iOS quirks where click fires late)
  svg.addEventListener('touchstart', (e) => {
    if (!e.target.closest('.marker') && e.touches.length === 1) {
      // Don't hide while user is mid-drag; only on initial single touch
      // The click handler above also fires, but this is faster on iOS
      hideTip();
    }
  }, { passive: true });


  // Wheel to zoom
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomBy(Math.exp(-e.deltaY * 0.0015));
    zHint.classList.add('fade');
  }, { passive: false });

  // Double-click to zoom in toward clicked point
  svg.addEventListener('dblclick', (e) => {
    const rect = svg.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (1000 / rect.width);
    const sy = (e.clientY - rect.top) * (560 / rect.height);
    const inv = projection.invert && projection.invert([sx, sy]);
    if(inv){
      view.rotate[0] = -inv[0];
      view.rotate[1] = -inv[1];
    }
    zoomBy(1.8);
    zHint.classList.add('fade');
  });

  // Animated flyTo — zoom-out arc then zoom-in to destination
  const REGIONS = {
    eu: { rotate: [-5, -50, 0], scale: BASE_SCALE * 5.5 },
    us: { rotate: [95, -40, 0],  scale: BASE_SCALE * 4.0 },
    ea: { rotate: [-120, -35, 0], scale: BASE_SCALE * 4.0 },
  };

  let flyAnim = null;
  function flyTo(region) {
    const target = REGIONS[region];
    if (!target) return;
    if (flyAnim) cancelAnimationFrame(flyAnim);

    const start = { rotate: [...view.rotate], scale: view.scale };
    const t0 = performance.now();

    // Compute angular distance to decide if we need the zoom-out arc
    const dLon = Math.abs(target.rotate[0] - start.rotate[0]);
    const dLat = Math.abs(target.rotate[1] - start.rotate[1]);
    const angularDist = Math.sqrt(dLon * dLon + dLat * dLat);
    const needsArc = angularDist > 20; // significant rotation → zoom out first

    // Zoom-out trough: pull back to global view mid-flight
    const midScale = needsArc ? BASE_SCALE * 1.0 : (start.scale + target.scale) / 2;
    const duration = needsArc ? 1400 : 800; // longer for cross-globe flights

    // Highlight active button
    document.querySelectorAll('.region-nav button').forEach(b => b.classList.remove('active-region'));
    const btn = document.getElementById('r-' + region);
    if (btn) btn.classList.add('active-region');
    zHint.classList.add('fade');

    function step(now) {
      const t = Math.min(1, (now - t0) / duration);
      // Ease in-out cubic for rotation
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      // Rotation: smooth interpolation
      view.rotate[0] = start.rotate[0] + (target.rotate[0] - start.rotate[0]) * e;
      view.rotate[1] = start.rotate[1] + (target.rotate[1] - start.rotate[1]) * e;
      view.rotate[2] = start.rotate[2] + ((target.rotate[2] || 0) - start.rotate[2]) * e;

      // Scale: parabolic arc — dip to midScale at t=0.5, arrive at target.scale at t=1
      // s(t) = (1-t)^2 * start + 2*(1-t)*t * mid + t^2 * target  (quadratic Bezier)
      const s0 = start.scale, s1 = midScale, s2 = target.scale;
      const oneMinusT = 1 - t;
      view.scale = oneMinusT * oneMinusT * s0 + 2 * oneMinusT * t * s1 + t * t * s2;

      redraw();

      if (t < 1) flyAnim = requestAnimationFrame(step);
      else flyAnim = null;
    }
    flyAnim = requestAnimationFrame(step);
  }

  // Region buttons
  document.getElementById('r-eu').onclick = () => flyTo('eu');
  document.getElementById('r-us').onclick = () => flyTo('us');
  document.getElementById('r-ea').onclick = () => flyTo('ea');

  // Buttons
  document.getElementById('z-in').onclick  = () => { zoomBy(1.6); zHint.classList.add('fade'); };
  document.getElementById('z-out').onclick = () => { zoomBy(1/1.6); };
  document.getElementById('z-reset').onclick = () => { flyTo('eu'); };

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.key === '+' || e.key === '=') zoomBy(1.4);
    else if(e.key === '-' || e.key === '_') zoomBy(1/1.4);
    else if(e.key === '0'){ flyTo('eu'); }
    else if(e.key === 'ArrowLeft')  { view.rotate[0] -= 10; redraw(); }
    else if(e.key === 'ArrowRight') { view.rotate[0] += 10; redraw(); }
    else if(e.key === 'ArrowUp')    { view.rotate[1] = Math.min(89, view.rotate[1] + 10); redraw(); }
    else if(e.key === 'ArrowDown')  { view.rotate[1] = Math.max(-89, view.rotate[1] - 10); redraw(); }
  });

  svg.style.cursor = 'grab';
  redraw();
  render();
})();

(function setupMobileDrawers(){
  const body = document.body;
  const left = document.querySelector('aside.left');
  const right = document.querySelector('aside.right');
  const backdrop = document.getElementById('drawer-backdrop');
  const btnFilters = document.getElementById('mob-filters');
  const btnSelected = document.getElementById('mob-selected');
  if (!left || !right || !btnFilters || !btnSelected) return;

  function closeAll(){
    left.classList.remove('open');
    right.classList.remove('open');
    body.classList.remove('drawer-open');
  }
  function openLeft(){
    closeAll();
    left.classList.add('open');
    body.classList.add('drawer-open');
    if (!left.querySelector('.drawer-close')) addCloseButton(left);
  }
  function openRight(){
    closeAll();
    right.classList.add('open');
    body.classList.add('drawer-open');
    if (!right.querySelector('.drawer-close')) addCloseButton(right);
  }
  function addCloseButton(el){
    const btn = document.createElement('button');
    btn.className = 'drawer-close';
    btn.innerHTML = '×';
    btn.setAttribute('aria-label', 'Close');
    btn.addEventListener('click', closeAll);
    el.appendChild(btn);
  }
  btnFilters.addEventListener('click', openLeft);
  btnSelected.addEventListener('click', openRight);
  backdrop.addEventListener('click', closeAll);

  // ESC to close
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAll();
  });

  // Update badge count for selected (looks at active filter chips)
  function updateBadge(){

    if (e.target.closest('.chip')) setTimeout(updateBadge, 50);
  });
})();



/* ============ TOUCH GESTURES (added 2026-05-28) ============ */
(function setupTouchGestures(){
  if (window.matchMedia('(min-width: 901px)').matches) return;  // desktop only
  const body = document.body;
  const left = document.querySelector('aside.left');
  const right = document.querySelector('aside.right');
  if (!left || !right) return;

  const EDGE_PX = 28;          // px from edge to detect open-from-edge swipe
  const MIN_DIST = 40;         // px minimum swipe distance to trigger
  const MAX_OFF_AXIS = 50;     // max vertical drift allowed
  const EDGE_HEIGHT_RATIO = 0.85;  // only top 85% of screen detects edge-swipes (avoid footer)

  let startX = null, startY = null, startEdge = null;

  function handleStart(e){
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    const fromLeftEdge = t.clientX < EDGE_PX;
    const fromRightEdge = t.clientX > window.innerWidth - EDGE_PX;
    const inUpperBand = t.clientY < window.innerHeight * EDGE_HEIGHT_RATIO;
    if (fromLeftEdge && inUpperBand) startEdge = 'left';
    else if (fromRightEdge && inUpperBand) startEdge = 'right';
    else startEdge = null;
  }
  function handleEnd(e){
    if (startX === null) return;
    const t = (e.changedTouches && e.changedTouches[0]);
    if (!t) { startX = null; return; }
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    if (absDy > MAX_OFF_AXIS || absDx < MIN_DIST) { startX = null; return; }

    // Swipe from left edge to the right: open Filters
    if (startEdge === 'left' && dx > 0) {
      document.getElementById('mob-filters')?.click();
    }
    // Swipe from right edge to the left: open Selected
    else if (startEdge === 'right' && dx < 0) {
      document.getElementById('mob-selected')?.click();
    }
    // Swipe LEFT while left drawer is open: close it
    else if (left.classList.contains('open') && dx < 0) {
      left.classList.remove('open');
      body.classList.remove('drawer-open');
    }
    // Swipe RIGHT while right drawer is open: close it
    else if (right.classList.contains('open') && dx > 0) {
      right.classList.remove('open');
      body.classList.remove('drawer-open');
    }
    startX = null;
  }
  // Use pointerdown/pointerup for unified mouse+touch (but mostly touch)
  document.addEventListener('touchstart', handleStart, { passive: true });
  document.addEventListener('touchend', handleEnd, { passive: true });
})();

// Retry until the async innerHTML render has placed the sheet div in DOM.
// (Earlier v11 ran synchronously before the async init completed, found null,
//  and silently early-returned — leaving window.__sheet undefined.)
(function waitForSheet(tries){
  const sheet = document.getElementById('sdl-sheet');
  const body = document.getElementById('sheet-body');
  if (!sheet || !body) {
    if (tries < 50) setTimeout(() => waitForSheet(tries + 1), 60);
    else console.warn('[bc-mobile] sheet element never appeared');
    return;
  }
  setupBottomSheet();
})(0);

function setupBottomSheet(){

  const body = document.getElementById('sheet-body');
  const closeBtn = document.getElementById('sheet-close');
  const backdrop = document.getElementById('drawer-backdrop');
  if (!sheet || !body) return;

  function isMobile(){ return window.matchMedia('(max-width: 900px)').matches; }

  function openSheet(d){
    if (!isMobile()) return;
    const CATS = window.SDL_CATEGORIES;   // scoped const inside async IIFE was unreachable here
    const tierLabel = CATS.tier.options.find(o => o.id === d.tier)?.label || d.tier;
    const matLabel = CATS.maturity.options.find(o => o.id === d.maturity)?.label || d.maturity;
    const domLabel = CATS.domain.options.find(o => o.id === d.domain)?.label || d.domain;
    const chLabel = CATS.charact.options.find(o => o.id === d.charact)?.label || d.charact;
    const tierColor = getComputedStyle(document.documentElement).getPropertyValue('--c-' + d.tier).trim() || '#888';
    body.innerHTML = `
      <div class="sheet-head">
        <span class="s-dot" style="background:${tierColor}"></span>
        <span class="s-name" id="sheet-name">${d.flag || ''} ${d.name}</span>
      </div>
      <div class="sheet-meta">${tierLabel} · ${d.city}, ${d.country}</div>
      <div class="sheet-row"><span class="k">Org</span><span class="v">${d.org || '—'}</span></div>
      <div class="sheet-row"><span class="k">Domain</span><span class="v">${domLabel}</span></div>
      <div class="sheet-row"><span class="k">Maturity</span><span class="v">${matLabel}</span></div>
      <div class="sheet-row"><span class="k">Characterisation</span><span class="v">${chLabel}</span></div>
      <div class="sheet-row"><span class="k">AI</span><span class="v">${d.ai || '—'}</span></div>
      <div class="sheet-row"><span class="k">Scale</span><span class="v">${d.scale || '—'}</span></div>
      <div class="sheet-row"><span class="k">Investment</span><span class="v">${d.investLabel || '—'}</span></div>
    `;
    sheet.style.transform = '';   // clear any stuck inline transform from prior swipe
    sheet.classList.add('open');
    document.body.classList.add('sheet-open');
    // Mark the selected marker
    document.querySelectorAll('.marker.selected').forEach(m => m.classList.remove('selected'));
    const markerEl = document.querySelector(`.marker[data-id="${d.id}"]`);
    if (markerEl) markerEl.classList.add('selected');
  }
  function closeSheet(){
    sheet.classList.remove('open');
    document.body.classList.remove('sheet-open');
    document.querySelectorAll('.marker.selected').forEach(m => m.classList.remove('selected'));
  }

  closeBtn?.addEventListener('click', closeSheet);
  backdrop?.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // Swipe-down on sheet to dismiss
  let touchStartY = null;
  let touchStartScroll = 0;
  sheet.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    touchStartY = e.touches[0].clientY;
    touchStartScroll = sheet.scrollTop;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (touchStartY === null) return;
    // Only allow swipe-down dismissal if sheet is scrolled to top
    if (sheet.scrollTop > 0) return;
    const dy = e.touches[0].clientY - touchStartY;
    if (dy > 0) {
      sheet.style.transform = `translateY(${dy}px)`;
    }
  }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (touchStartY === null) return;
    const dy = (e.changedTouches[0]?.clientY ?? touchStartY) - touchStartY;
    sheet.style.transform = '';   // remove inline
    if (sheet.scrollTop === 0 && dy > 80) closeSheet();
    touchStartY = null;
  }, { passive: true });

  // Hook pin tap → openSheet on mobile
  // We can't reuse showTip's signature directly; intercept .marker click events
  document.addEventListener('click', e => {
    if (!isMobile()) return;
    const m = e.target.closest('.marker');
    if (!m) return;
    const id = m.getAttribute('data-id');
    if (!id) return;
    const d = window.SDL_DATA.find(x => x.id === id);
    if (d) openSheet(d);
  });

  // Hide the desktop tip immediately on mobile so it doesn't flash
  if (isMobile()) {
    const tip = document.querySelector('.tip');
    if (tip) tip.style.display = 'none';
  }
  // Expose for debugging
  window.__sheet = { openSheet, closeSheet };
  console.log('[bc-mobile] setupBottomSheet ready, window.__sheet set');
}


/* ============ MOBILE v12 — defensive button bindings + smooth zoom ============ */
(function setupV12(){
  // === 1. Defensive event delegation for drawer toggle buttons ===
  // Works even if earlier IIFE failed to find the buttons at script-load time
  function getDrawers(){
    return {
      left:  document.querySelector('aside.left'),
      right: document.querySelector('aside.right'),
      back:  document.getElementById('drawer-backdrop')
    };
  }
  function closeAllDrawers(){
    const {left, right, back} = getDrawers();
    left?.classList.remove('open');
    right?.classList.remove('open');
    document.body.classList.remove('drawer-open');
    if (back) back.style.display = '';  // clear any stale inline display
  }
  function openDrawer(side){
    const {left, right, back} = getDrawers();
    closeAllDrawers();
    const el = side === 'left' ? left : right;
    if (!el) return;
    el.classList.add('open');
    document.body.classList.add('drawer-open');
    // backdrop visibility is handled via CSS (body.drawer-open .drawer-backdrop {display:block})
    // Add a close × button to the drawer if not already present
    if (!el.querySelector('.drawer-close')) {
      const btn = document.createElement('button');
      btn.className = 'drawer-close';
      btn.innerHTML = '×';
      btn.setAttribute('aria-label', 'Close');
      btn.addEventListener('click', closeAllDrawers);
      btn.addEventListener('pointerdown', e => { e.stopPropagation(); }, {passive: true});
      el.appendChild(btn);
    }
  }
  // Use BOTH pointerdown (faster on iOS) AND click (universal) so taps register
  // even if iOS suppresses the synthesized click after a missed pointerdown.
  ['pointerdown','click'].forEach(evt => {
    document.addEventListener(evt, e => {
      const t = e.target.closest('#mob-filters, #mob-selected, .drawer-close, .drawer-backdrop');
      if (!t) return;
      e.preventDefault();
      e.stopPropagation();
      if (t.id === 'mob-filters') openDrawer('left');
      else if (t.id === 'mob-selected') openDrawer('right');
      else if (t.classList.contains('drawer-close') || t.classList.contains('drawer-backdrop')) closeAllDrawers();
    }, { passive: false });
  });
  // Visible-debug: tap any button briefly flashes its background — user can confirm tap detected
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('#mob-filters, #mob-selected');
    if (!t) return;
    t.style.background = 'rgba(255,255,255,0.2)';
    setTimeout(() => { t.style.background = ''; }, 180);
  }, { passive: true });

  // === 2. Smooth-animated zoom for +/− buttons (Maps-app feel) ===
  let zoomAnimId = null;
  function smoothZoom(factor, durationMs){
    cancelAnimationFrame(zoomAnimId);
    durationMs = durationMs || 260;
    const startScale = view.scale;
    const targetScale = clampScale(startScale * factor);
    const t0 = performance.now();
    function step(){
      const t = (performance.now() - t0) / durationMs;
      if (t >= 1) {
        view.scale = targetScale;
        redraw();
        document.body.classList.remove('interacting');
        zoomAnimId = null;
        return;
      }
      // Ease-out cubic
      const e = 1 - Math.pow(1 - t, 3);
      view.scale = startScale + (targetScale - startScale) * e;
      redraw();
      zoomAnimId = requestAnimationFrame(step);
    }
    document.body.classList.add('interacting');
    zoomAnimId = requestAnimationFrame(step);
  }
  // Override the +/− button onclick to use smoothZoom
  const zIn  = document.getElementById('z-in');
  const zOut = document.getElementById('z-out');
  if (zIn)  zIn.onclick  = () => smoothZoom(1.7, 260);
  if (zOut) zOut.onclick = () => smoothZoom(1/1.7, 260);

  // === 3. Double-tap to zoom in (Maps-app classic) ===
  // Uses local pointer tracking; doesn't depend on the drag IIFE's `pointers`
  function attachDoubletapZoom(){
    const svg = document.getElementById('map');
    if (!svg) return;
    let lastTapTime = 0;
    let lastTapX = 0, lastTapY = 0;
    const tapPointers = new Map();   // local — independent of drag IIFE
    svg.addEventListener('pointerdown', e => {
      tapPointers.set(e.pointerId, {x: e.clientX, y: e.clientY, t: performance.now()});
      if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
      if (e.target.closest('.marker')) return;
      const now = performance.now();
      const dx = Math.abs(e.clientX - lastTapX);
      const dy = Math.abs(e.clientY - lastTapY);
      if (now - lastTapTime < 320 && dx < 30 && dy < 30 && tapPointers.size === 1) {
        // Double-tap detected → zoom in 1.8× toward tap point
        const rect = svg.getBoundingClientRect();
        const sx = (e.clientX - rect.left) * (1000 / rect.width);
        const sy = (e.clientY - rect.top)  * (560  / rect.height);
        try {
          const inv = projection.invert && projection.invert([sx, sy]);
          if (inv) {
            view.rotate[0] = -inv[0];
            view.rotate[1] = -inv[1];
          }
        } catch(_) {}
        smoothZoom(1.8, 300);
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapX = e.clientX;
        lastTapY = e.clientY;
      }
    });
    function pointerEnd(e){
      const start = tapPointers.get(e.pointerId);
      tapPointers.delete(e.pointerId);
      if (!start) return;
      // Two-finger tap-out detection: if 2 pointers came down briefly, then both released without moving much
      const dur = performance.now() - start.t;
      const moved = e.clientX != null ? Math.hypot(e.clientX - start.x, e.clientY - start.y) : 0;
      if (tapPointers.size === 1 && dur < 280 && moved < 18) {
        // The OTHER pointer just released after a short two-finger tap → zoom out
        const other = tapPointers.values().next().value;
        if (other && performance.now() - other.t < 320) {
          smoothZoom(1/1.8, 280);
          tapPointers.clear();   // consume
        }
      }
    }
    svg.addEventListener('pointerup', pointerEnd);
    svg.addEventListener('pointercancel', e => { tapPointers.delete(e.pointerId); });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachDoubletapZoom);
  } else {
    attachDoubletapZoom();
  }
})();


/* v13 SAFETY: body.interacting class can never stay on for more than 2s
   without an active touch — guards against stuck-class bugs */
(function () {
  let lastActivity = 0;
  document.addEventListener('pointerdown', () => { lastActivity = performance.now(); }, { passive: true });
  document.addEventListener('pointermove', () => { lastActivity = performance.now(); }, { passive: true });
  document.addEventListener('pointerup', () => { lastActivity = performance.now(); }, { passive: true });
  setInterval(() => {
    if (!document.body.classList.contains('interacting')) return;
    if (performance.now() - lastActivity > 2000) {
      document.body.classList.remove('interacting');
    }
  }, 800);
  // Also cancel + clear on visibility-change / blur
  window.addEventListener('blur', () => document.body.classList.remove('interacting'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) document.body.classList.remove('interacting');
  });
})();


/* v14 DIAG: short window-attached log for Safari Web Inspector debugging */
window.__bcdebug = {
  log: (...args) => { console.log('[bc-mobile]', ...args); window.__bcdebug.history.push(args); },
  history: []
};
(function () {
  function isMobile(){ return window.matchMedia('(max-width: 900px)').matches; }
  document.addEventListener('click', e => {
    const m = e.target.closest('.marker');
    if (m) {
      window.__bcdebug.log('marker click', m.getAttribute('data-id'), 'isMobile=', isMobile());
      const sheet = document.getElementById('sdl-sheet');
      window.__bcdebug.log('sheet exists=', !!sheet, 'sheet has .open=', sheet?.classList.contains('open'));
    }
  });
})();


/* v20: one-shot pre-warm so the first real touch doesn't pay first-time layer cost.
   Toggles body.interacting once at idle to flush CSS recalc + layer promotion. */
window.requestIdleCallback ? requestIdleCallback(prewarmInteracting, {timeout: 1500}) : setTimeout(prewarmInteracting, 800);
function prewarmInteracting(){
  document.body.classList.add('interacting');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.body.classList.remove('interacting');
    });
  });
}


/* v23: hard gesture lock — preventDefault any touchmove outside a scrollable area */
(function gestureGuard(){
  const scrollableSel = 'aside.left, aside.right, .sheet, .sheet-body';
  document.addEventListener('touchmove', e => {
    if (!e.target.closest(scrollableSel)) {
      e.preventDefault();
    }
  }, { passive: false, capture: true });
  // Also block pinch-zoom gestures explicitly (iOS gesturestart event)
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
  document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });
  // Block double-tap zoom (iOS pattern detection)
  let lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = performance.now();
    if (now - lastTap < 320) e.preventDefault();
    lastTap = now;
  }, { passive: false });
})();
</script>
